# Refactor backlog — bin/nwn-wiki (18,618 lines) -> bin/nwn_wiki/ package.
#
# Sole loop state for the refactor autopilot (with git).  See
# CLAUDE-refactor-autopilot.md for the loop, the gate and the hard rules.
#
# Item schema:
#   id            kebab-case, unique.  Also names gates/<id>.json.
#   phase         1 split | 2 chrome bugs | 3 dedup | 4 giants
#   title         one line
#   status        pending | design | done
#   gate          zero-diff | expected-diff
#   after         [ids] that must be done first (must appear earlier in the file)
#   ranges        line ranges in the ORIGINAL bin/nwn-wiki, for orientation only
#   plan          what to do
#   # set when shipped:
#   commit / date / gate_result / impl_notes / found / design_questions
#
# Line ranges are against the pre-refactor monolith and go stale as items land.
# Locate code by symbol name (grep), not by line number.

