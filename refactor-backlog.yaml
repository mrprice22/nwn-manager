- id: db-core
  phase: 1
  title: Split Db construction/loading/interning into db/core.py
  status: done
  gate: zero-diff
  commit: 357e54a
  date: 2026-08-09
  gate_result: "check --all: homers_lotr IDENTICAL (137s), lotr2008 IDENTICAL (86s), lotr2009 IDENTICAL (102s)"
  impl_notes: >
    MECHANISM FOR THE WHOLE db-* SERIES — follow it in db-index .. db-names.  New
    package db/: each concern is one mixin class in its own module, and the concrete
    class stays declared in cli.py as `class Db(<mixins...>, DbCore)`.  DbCore owns
    __init__ and must stay LAST in the MRO; every later item adds one module
    defining a Db<Concern>Mixin and prepends it to the bases list.  Mixins never
    subclass or import each other, so they stay independently movable and the MRO
    stays trivial.  The convention is written up in db/__init__.py.  When the last
