- id: sort-set-iteration
  phase: 4
  title: Sort the set iterations that make the build non-deterministic
  status: design
  gate: expected-diff
  after: [main-split]
  plan: >
    The build is not reproducible run-to-run: with PYTHONHASHSEED unset, string
    hash randomisation reorders the area-map SVG nodes, the faction table rows
    and some conversation tables (~1700 changed lines per run on the lotr2008
    corpus alone).  bin/wiki-golden pins PYTHONHASHSEED=0 to work around it.
    The real fix is to sort those iterations at the point of emission.
  design_questions:
    - question: >
        This is pre-existing, not caused by the refactor — but it means every
        published docs/ rebuild churns thousands of lines in git for no semantic
        reason, which makes `git add -A docs` commits noisy and real changes hard
        to spot.  Recommend fixing it (sort at emission; one-off large diff, then
        stable output forever).  Fix it, or leave it and keep the
        PYTHONHASHSEED=0 pin in the gate?
      status: open
      answer: null
