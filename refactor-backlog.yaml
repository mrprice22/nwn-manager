- id: site-chrome-object
  phase: 2
  title: Replace the nav globals with one SiteChrome object built once
  status: pending
  gate: expected-diff
  after: [cli-module]
  plan: >
    Build a SiteChrome in cli.main() AFTER every loader has run, carrying the
    facts the nav depends on (has_activity, has_server_firsts, boss_registry,
    manual_menus, theme, and the new has_inaccessible/has_creature_pics).  Pass
    it into page().  Serialise it to docs/.chrome.json, and make
    bin/nwn-wiki-activity LOAD that file instead of hand-rebuilding globals.
    Fixes the one genuine desync mechanism: that subprocess currently re-execs
    the program in a fresh interpreter, sets _HAS_ACTIVITY_PAGE = True
    unconditionally, and rewrites activity.html + every manual/**.html — so those
    pages can carry a different nav bar from the rest of the wiki.  After this,
    the subprocess computes nothing, so it cannot disagree.
  expected_diff: "one new file docs/.chrome.json; no page content changes"

- id: nav-gate-conditional
  phase: 2
  title: Gate the Pictures and Inaccessible nav entries on those pages existing
  status: pending
  gate: expected-diff
  after: [site-chrome-object]
  plan: >
    page() emits items/inaccessible/index.html and creatures/pictures.html
    unconditionally, but render_inaccessible_index and render_creature_pictures
    both early-return when their data is empty — so the nav can link to pages
    that were never written.  bosses.html is already gated correctly on the same
    global its renderer checks; apply that pattern to the other two, feeding
    has_inaccessible / has_creature_pics from the same predicates.
  expected_diff: "nav <li> removed from every page when the target is absent"

- id: root-rel-derive
  phase: 2
  title: Derive root_rel from the output path instead of threading it by hand
  status: pending
  gate: expected-diff
  after: [nav-gate-conditional]
  plan: >
    root_rel is passed as a "." / ".." / "../.." string through 17 functions, and
    the helper block holds TWO CONTRADICTORY DEFAULTS — "." on _faction_dd,
    _faction_cell, _race_link; ".." on _script_link, _conv_link,
    _store_opener_html, _caller_html, _creature_detail_sections.  Correctness
    currently rests on an unwritten "only called from depth 1" rule.  All 34
    page() call sites are correct today, so this is a latent trap, not a live
    bug — fix it by construction: page() takes the output Path and computes depth
    from it, helpers take a context carrying that depth.  Fold in the three
    parallel mechanisms for the same idea: _items_row(prefix=),
    _store_inventory_html(item_prefix=), _pic_figures(prefix=).
