  impl_notes: >
    New htmlgen/pagectx.py holds a frozen PageCtx dataclass carrying one fact: the
    page's output-root-relative path.  root_rel, the write location and every link
    prefix are all derived from it (depth, root_rel, url(), dir_url(), path(out)),
