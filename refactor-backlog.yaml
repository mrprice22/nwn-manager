    _prop_row into one Python form builder.  ~130 JS + ~40 Py.
  notes: >
    The gate compares generated HTML byte-for-byte, so any change to the emitted
    <script> block shows up as a diff.  Plan for the HTML to shrink to a small
    config object plus an initSearch call — that IS an intended diff, so this
    item may need to become expected-diff once the shape is settled.

- id: dedup-formatting
  phase: 3
  title: Consolidate the numeric formatting helpers
  status: pending
  gate: zero-diff
  after: [dedup-search-js]
  plan: >
    _fmt_hp and _fmt_cost are ~90% identical.  f"{x:,}" is written by hand at 25
    sites outside them, including the exact idiom
    `f"{max_gp:,}" if max_gp > 0 else "—"` copy-pasted at three.  _try_int exists
    but the same try/int/except is inlined elsewhere.
  notes: >
    CONTAINS A REAL BEHAVIOURAL FORK: _parse_cr returns 0.0 for an unparseable
    CR, _creature_cr_value returns -1.0, and _creature_cr_value re-implements
    _parse_cr rather than calling it.  Those sentinels sort differently.  Resolve
    it deliberately — if which one is correct isn't obvious, take the
    design-question hatch.  Do NOT silently unify them.

